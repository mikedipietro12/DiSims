<body>
  <div class="module-wrap">
    <div class="top-nav">
      <a href="index.html" class="back-link">← IMF hub</a>
      <div class="mod-meta">Room 2 · Sandbox</div>
    </div>

    <nav class="room-switch" aria-label="IMF rooms">
      <a href="index.html" data-room="hub">Hub</a>
      <a href="guide.html" data-room="guide">Guide</a>
      <a href="sandbox.html" data-room="sandbox">Sandbox</a>
      <a href="heat.html" data-room="heat">Heat</a>
    </nav>

    <div class="sandbox-layout">
      <div class="sandbox-lead">
        <div class="stub-kicker">Room 2</div>
        <h1 id="sandboxTitle">Sandbox</h1>
        <p>Pick two molecules and bring them close. Watch the shaped electron clouds - force names stay off on purpose.</p>
      </div>

      <div class="controls-row">
        <div class="field">
          <label for="molA">Molecule A</label>
          <select id="molA"></select>
        </div>
        <div class="field">
          <label for="molB">Molecule B</label>
          <select id="molB"></select>
        </div>
      </div>

      <div class="stage-wrap">
        <canvas id="stage" width="640" height="360" role="img" aria-label="Two molecules on a flat stage. Drag them close to see how they interact."></canvas>
      </div>
      <p class="hud-quiet"><span id="hud">Drag a molecule</span> · <span id="status" aria-live="polite"></span></p>
    </div>

  </div>
  <script src="assets/molecules.js?v=5"></script>
  <script src="assets/pairs.js?v=6"></script>
  <script src="assets/imf-engine.js?v=69"></script>
  <script src="assets/suite-chrome.js?v=1"></script>
  <script>
(function () {
  var selA = document.getElementById('molA');
  var selB = document.getElementById('molB');
  var canvas = document.getElementById('stage');
  var hud = document.getElementById('hud');

  ImfMolecules.LIST.forEach(function (m) {
    var o1 = document.createElement('option');
    o1.value = m.id;
    o1.textContent = m.formula + ' - ' + m.name;
    selA.appendChild(o1);
    var o2 = o1.cloneNode(true);
    selB.appendChild(o2);
  });
  selA.value = 'h2o';
  selB.value = 'h2o';

  var statusEl = document.getElementById('status');
  var STATUS_TEXT = {
    apart: 'Far apart',
    drifting: 'Close, barely interacting',
    pulling: 'Pulling together',
    pushing: 'Pushing apart',
    touching: 'Touching, held together',
  };

  var stage = ImfEngine.create({
    canvas: canvas,
    showDeltas: false,
    // same squishy teardrop clouds as the Guide's force beats
    cloudMode: 'polar',
    cloudShape: 'drop',
    cloudPad: 24,
    // keep a visible gap at contact so the clouds, not the atoms, do the touching
    spacing: 12,
    onStatus: function (s) {
      statusEl.textContent = STATUS_TEXT[s] || '';
    },
  });
  stage.setShowForceLabels(false);
  stage.setPair(selA.value, selB.value);
  stage.start();
  window.__imfStage = stage;

  function applyPair() {
    stage.setPair(selA.value, selB.value);
    var fa = ImfMolecules.get(selA.value).formula;
    var fb = ImfMolecules.get(selB.value).formula;
    hud.textContent = fa + '  ·  ' + fb;
  }

  selA.addEventListener('change', applyPair);
  selB.addEventListener('change', applyPair);

  applyPair();
})();
  </script>
</body>
</html>
