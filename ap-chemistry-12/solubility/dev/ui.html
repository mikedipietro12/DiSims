<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/suite.css?v=15">
  <link rel="stylesheet" href="../assets/sol.css?v=10">
  <style>
/* Dev-only page for Task 5: the shared readout, Q vs Ksp check and worked steps, on the real engine. */
.dev-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:1rem;margin-top:1rem;align-items:start;}
.dev-card{background:var(--tray);border:2px solid var(--line-strong);border-radius:var(--radius-lg);box-shadow:var(--key-drop);padding:1.1rem 1.2rem;}
.dev-card h2{margin:0 0 0.8rem;font-size:1.3rem;}
.dev-stack{display:flex;flex-direction:column;gap:1rem;}
.dev-controls{display:flex;flex-wrap:wrap;gap:0.55rem;margin-bottom:0.9rem;}
/* a stand-in picture so each step can mark part of it */
.demo-pic{display:flex;align-items:center;justify-content:center;gap:0.9rem;margin-bottom:1rem;padding:0.9rem;border-radius:var(--radius);background:var(--sol-water);font-weight:700;font-size:1.15rem;}
.demo-pic .chip{padding:0.3rem 0.6rem;border-radius:10px;border:2px solid var(--ink);transition:box-shadow .2s, transform .2s;}
.demo-pic .solid{background:var(--ppt-pbi2);}
.demo-pic .cat{background:var(--sol-cat);}
.demo-pic .an{background:var(--sol-an);}
.demo-pic .amt{display:block;text-align:center;font-family:var(--font-mono);font-size:0.85rem;color:var(--dim);margin-top:0.25rem;visibility:hidden;}
.demo-pic [data-mark].on .chip{box-shadow:0 0 0 4px var(--accent);transform:translateY(-2px);}
.demo-pic [data-mark].on .amt,.demo-pic.show-amt .amt{visibility:visible;}
@media (max-width:900px){.dev-grid{grid-template-columns:minmax(0,1fr);}}
.demo-pic{flex-wrap:wrap;}
  </style>
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
</head>
<body>
  <div class="module-wrap">
    <div class="top-nav">
      <a href="../index.html" class="back-link">← Solubility &amp; Ksp</a>
      <div class="mod-meta">Shared components · dev only</div>
    </div>
    <h1 style="font-size:2rem;margin:0 0 0.3rem;">Readouts, Q vs K<sub>sp</sub> and worked steps</h1>
    <p style="color:var(--dim);max-width:60rem;margin:0;">The same components every room will use, running on the real engine with lead(II) iodide.</p>

    <div class="dev-grid">
      <section class="dev-card" aria-labelledby="wsTitle">
        <h2 id="wsTitle">Molar solubility of PbI<sub>2</sub> from K<sub>sp</sub></h2>
        <div class="demo-pic" id="pic" aria-hidden="true">
          <span data-mark="eqn"><span class="chip solid">PbI<sub>2</sub>(s)</span></span>
          <span>→</span>
          <span data-mark="cat"><span class="chip cat">Pb<sup>2+</sup></span><span class="amt">x</span></span>
          <span>+</span>
          <span data-mark="an"><span class="chip an">2 I<sup>−</sup></span><span class="amt">2x</span></span>
        </div>
        <div id="steps"></div>
      </section>
      <div class="dev-stack">
        <section class="dev-card" aria-labelledby="qkTitle">
          <h2 id="qkTitle">Is it saturated?</h2>
          <div class="dev-controls">
            <button type="button" class="btn" id="scoop">Add a scoop</button>
            <button type="button" class="btn" id="ki">Add KI</button>
            <button type="button" class="btn" id="reset">Start over</button>
          </div>
          <div id="gauge"></div>
        </section>
        <section class="dev-card" aria-labelledby="rdTitle">
          <h2 id="rdTitle">In the beaker</h2>
          <div id="read"></div>
        </section>
      </div>
    </div>
  </div>
<script src="../assets/salts.js?v=1"></script>
<script src="../assets/sol-engine.js?v=1"></script>
<script src="../assets/sol-ui.js?v=5"></script>
<script>
(function () {
  const D = SolData, E = SolEngine, U = SolUI;
  const id = 'PbI2', s = D.SALTS[id], V = 0.100;
  let beaker = E.createBeaker({ volume: V });

  // ---- worked steps, every number from salts.js ----
  const sv = D.molarSolubility(s), M = s.molarMass;
  const n = (x, o) => U.num(x, o).html;
  const pic = document.getElementById('pic');
  const lines = [
    { lhs: 'PbI<sub>2</sub>(s) ⇌ Pb<sup>2+</sup> + 2 I<sup>−</sup>', note: 'Each PbI<sub>2</sub> that dissolves gives one Pb<sup>2+</sup> and two I<sup>−</sup>', mark: ['eqn', 'cat', 'an'],
      speech: 'P b I 2 solid dissolves to give P b 2 plus and 2 I minus. Each P b I 2 that dissolves gives one lead ion and two iodide ions.' },
    { lhs: 'K<sub>sp</sub>', rhs: '[Pb<sup>2+</sup>][I<sup>−</sup>]<sup>2</sup>', note: 'The solid is left out', mark: ['cat', 'an'],
      speech: 'K s p equals the lead ion concentration times the iodide concentration squared. The solid is left out.' },
    { rhs: '(x)(2x)<sup>2</sup>', note: 'If x mol/L dissolves, [Pb<sup>2+</sup>] = x and [I<sup>−</sup>] = 2x', mark: ['cat', 'an'], amt: true,
      speech: 'equals x times 2 x, squared. If x moles per litre dissolves, the lead ion concentration is x and the iodide concentration is 2 x.' },
    { rhs: '4x<sup>3</sup>', speech: 'equals 4 x cubed.' },
    { lhs: 'x', rhs: '∛(K<sub>sp</sub> ÷ 4) = ∛(' + n(s.ksp, { sci: 'always' }) + ' ÷ 4)', note: 'K<sub>sp</sub> from the Data Booklet',
      speech: 'x equals the cube root of K s p divided by 4, which is the cube root of ' + U.num(s.ksp, { sci: 'always' }).speech + ' divided by 4. K s p is from the Data Booklet.' },
    { lhs: 'x', rhs: n(sv, { sci: 'always', unit: 'mol/L' }), note: 'This is the molar solubility, s', mark: ['cat'], amt: true,
      speech: 'x equals ' + U.num(sv, { sci: 'always', unit: 'mol/L' }).speech + '. This is the molar solubility, s.' },
    { lhs: 's', rhs: '(' + n(sv, { sci: 'always', unit: 'mol/L' }) + ')(' + M.toFixed(1) + ' <span class="num-unit">g/mol</span>)', note: 'Times the molar mass gives grams per litre',
      speech: 's in grams per litre equals ' + U.num(sv, { sci: 'always', unit: 'mol/L' }).speech + ' times ' + M.toFixed(1) + ' grams per mole. Times the molar mass gives grams per litre.' },
    { rhs: n(sv * M, { unit: 'g/L' }), speech: 'equals ' + U.num(sv * M, { unit: 'g/L' }).speech + '.' }
  ];
  let amtOn = false;
  const ws = U.steps(document.getElementById('steps'), lines, {
    onStep(i, line) {
      pic.querySelectorAll('[data-mark]').forEach(m => m.classList.toggle('on', !!(line && line.mark && line.mark.includes(m.dataset.mark))));
      if (line && line.amt) amtOn = true; if (i < 2) amtOn = false;
      pic.classList.toggle('show-amt', amtOn);
    }
  });

  // ---- readout + Q vs Ksp on the real engine ----
  const gauge = U.qvkForSalt(document.getElementById('gauge'), D, id, { live: true });
  const read = U.saltReadout(document.getElementById('read'), D, id);
  document.getElementById('scoop').addEventListener('click', () => beaker.addSolid(id, E.scoopMol(id, V)));
  document.getElementById('ki').addEventListener('click', () => beaker.addReagent('KI', 0.0004));
  document.getElementById('reset').addEventListener('click', () => { beaker = E.createBeaker({ volume: V }); });

  // dev hooks for screenshots: #sat (saturated with solid), #ki (common ion, mid-way), #half (Q ≈ Ksp/4), #steps=N
  const h = location.hash;
  if (/sat|ki/.test(h)) { for (let i = 0; i < 3; i++) beaker.addSolid(id, E.scoopMol(id, V)); beaker.settle(); }
  if (/ki/.test(h)) { beaker.addReagent('KI', 0.0004); for (let i = 0; i < 20; i++) beaker.step(1 / 60); }
  if (/half/.test(h)) { beaker.addSolid(id, E.scoopMol(id, V) * 0.5); beaker.settle(); }
  const m = h.match(/steps=(\d+)/); if (m) for (let i = 0; i < +m[1]; i++) ws.next();

  function frame() {
    beaker.step(1 / 60);
    const all = beaker.state();
    read.update(all, beaker.T);
    gauge.updateFrom(all, id);
    requestAnimationFrame(frame);
  }
  const all0 = beaker.state(); read.update(all0, beaker.T); gauge.updateFrom(all0, id, { snap: true });
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
