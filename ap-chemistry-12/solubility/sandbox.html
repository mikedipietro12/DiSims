    <h1 class="sr-only">Solubility Sandbox</h1>

    <section class="sbx" aria-label="Sandbox">
      <div class="sbx-modes" role="group" aria-label="Mode">
        <button type="button" class="btn" data-mode="dissolve" aria-pressed="true">Dissolve a solid</button>
        <button type="button" class="btn" data-mode="mix" aria-pressed="false">Mix two solutions</button>
      </div>

      <div class="sbx-grid">
        <div class="sbx-main">
          <div class="sbx-salts" id="salts" role="group" aria-label="Salt"></div>
          <div class="sbx-canvas"><canvas id="cv" role="img" aria-label=""></canvas></div>
          <p class="sbx-hint">Tap the picture to skip to the end.</p>

          <div class="sbx-controls" id="dissolveCtl">
            <div class="sbx-row" id="stressBtns"></div>
            <div class="sbx-row">
              <label class="sg-temp" id="tempWrap"><span>Temperature</span><input id="temp" type="range" min="0" max="100" step="1" value="25"><output id="tempOut">25 °C</output></label>
            </div>
            <p class="sbx-note" id="tempNote" hidden></p>
          </div>

          <div class="sbx-controls" id="mixCtl" hidden>
            <div class="sbx-mix">
              <fieldset class="sbx-sol" id="solA"><legend></legend>
                <label>Concentration <input type="range" min="-6" max="-1" step="0.1" value="-3"><output></output></label>
                <label>Volume <input type="range" min="10" max="75" step="5" value="50"><output></output></label>
              </fieldset>
              <fieldset class="sbx-sol" id="solB"><legend></legend>
                <label>Concentration <input type="range" min="-6" max="-1" step="0.1" value="-3"><output></output></label>
                <label>Volume <input type="range" min="10" max="75" step="5" value="50"><output></output></label>
              </fieldset>
            </div>
            <div class="sbx-row">
              <button type="button" class="btn primary" id="mixBtn">Mix</button>
              <button type="button" class="btn" id="mixReset">Start over</button>
            </div>
          </div>
        </div>

        <aside class="sbx-side" aria-label="Readings">
          <div id="check"></div>
          <div id="readout"></div>
        </aside>
      </div>
      <p class="sr-only" id="live" aria-live="polite"></p>
    </section>
  </div>
