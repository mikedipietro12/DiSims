<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Self-test runner</title>
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
</head>
<body>
  <p>Loading the page with its self-test… (run.html?page=review.html&amp;test=review-test.js&amp;selftest)</p>
  <script>
    // Loads ../<page> as this page with dev/<test> added, so the page's own self-test runs in its real markup.
    // Extra query parameters (e.g. m=ch4 for the Lab) pass through: the page reads location.search as usual.
    var q = new URLSearchParams(location.search);
    var page = q.get('page') || 'review.html', test = q.get('test') || 'review-test.js';
    if (!/^[\w-]+\.html$/.test(page) || !/^[\w-]+\.js$/.test(test)) throw new Error('page and test must be plain file names');
    fetch('../' + page, { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (html) {
      html = html.replace(/<head>/i, '<head><base href="../">')
        .replace(/<\/body>/i, '<script src="dev/' + test + '?v=' + Date.now() + '"><\/script></body>');
      document.open(); document.write(html); document.close();
    });
  </script>
</body>
</html>
