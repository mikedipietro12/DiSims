<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Scene screenshot harness</title>
  <!-- Dev only: mounts one Guide scene in a stage-sized box, for headless screenshots (the full Guide captures blank).
       scene-shot.html?scene=paper&mols=pcl3 hcn …&click=ch3oh&w=1180&h=700 -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/suite.css">
  <link rel="stylesheet" href="../assets/bonding.css">
  <style>
    body{margin:0;padding:16px;background:var(--bg, #eef1f6);}
    .shot{display:flex;flex-direction:column;}
  </style>
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
</head>
<body>
  <div class="guide-stage-panel shot" id="panel"><div class="guide-stage-body"><div class="scene-host" id="host"></div></div></div>
  <script>
    var SCENES = {};
    window.GuideShell = { registerScene: function (n, f) { SCENES[n] = f; }, shell: null };
  </script>
  <script src="../assets/bonding-kit.js"></script>
  <script src="../assets/lewis-model.js"></script>
  <script src="../assets/draw-engine.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="../assets/geometry.js"></script>
  <script src="../assets/shape-view.js"></script>
  <script src="../assets/turntable.js"></script>
  <script src="../assets/shape-lift.js"></script>
  <script src="../assets/scenes/scene-kit.js"></script>
  <script src="../assets/scenes/ch-b.js"></script>
  <script src="../assets/chem-text.js"></script>
  <script>
    var q = new URLSearchParams(location.search);
    var panel = document.getElementById('panel');
    panel.style.width = (q.get('w') || 1180) + 'px';
    panel.style.height = (q.get('h') || 700) + 'px';
    var beat = document.createElement('article');
    beat.dataset.mols = q.get('mols') || 'pcl3 hcn chcl3 c2h2 ocn so2 sf4 xef2 clf3 nh3 ccl4 bf3 brf5 h2co ch3oh cs2 nf3 scn i3 icl4';
    SCENES[q.get('scene') || 'paper'](document.getElementById('host'), beat, {});
    var click = q.get('click');
    if (click) {
      var f = BondingKit.get(click).formula;
      Array.prototype.forEach.call(document.querySelectorAll('.paper-tile'), function (t) { if (t.textContent === f) t.click(); });
    }
  </script>
</body>
</html>
