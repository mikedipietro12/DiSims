<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lewis Model Tests | Chemical Bonding (dev)</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../../assets/suite.css?v=20261113m">
  <style>
    .wrap{max-width:960px;margin:0 auto;padding:1.5rem 1.4rem 4rem;}
    h1{font-size:2rem;letter-spacing:-0.03em;margin:0.3rem 0 0.8rem;}
    #summary{font-family:var(--font-mono);font-weight:700;font-size:1.1rem;margin-bottom:1rem;}
    table{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:0.8rem;background:#fff;border:2px solid var(--ink);border-radius:12px;overflow:hidden;}
    td{padding:0.3rem 0.6rem;border-bottom:1px solid var(--line);vertical-align:top;}
    td.r{width:4.5rem;font-weight:700;}
    tr.fail td{background:var(--accent-soft);}
  </style>
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
</head>
<body>
  <div class="wrap">
    <p class="stub-kicker">Dev · Task 3</p>
    <h1>Lewis model tests</h1>
    <p id="summary">Running…</p>
    <table><tbody id="rows"></tbody></table>
  </div>
  <script src="../assets/bonding-kit.js?v=20261113m"></script>
  <script src="../assets/lewis-model.js?v=20261113m"></script>
  <script src="lewis-tests.js"></script>
  <script>
    (function () {
      var T = window.LewisTests;
      document.getElementById('summary').textContent = T.passed + ' / ' + T.total + ' passed';
      var rows = document.getElementById('rows');
      // Failures first
      T.results.slice().sort(function (a, b) { return a.ok - b.ok; }).forEach(function (r) {
        var tr = document.createElement('tr');
        if (!r.ok) tr.className = 'fail';
        tr.innerHTML = '<td class="r"></td><td></td><td></td>';
        tr.children[0].textContent = r.ok ? 'pass' : 'FAIL';
        tr.children[1].textContent = r.name;
        tr.children[2].textContent = r.ok ? '' : r.detail;
        rows.appendChild(tr);
      });
    })();
  </script>
</body>
</html>
