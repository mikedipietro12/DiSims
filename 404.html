    /* The sims moved into course folders on 2026-11-25. GitHub Pages serves this page for any
       missing address, so old links and bookmarks are sent on to the new address here.
       Old path prefix (decoded) -> new path. Most specific first. */

      var MOVES = [
        ['/ap-chemistry-12/kinetics.html',    '/ap-chemistry-12/kinetics/'],
        ['/ap-chemistry-12/acids-bases.html', '/ap-chemistry-12/acids-bases/'],

        ['/beers_law.html',                   '/ap-chemistry-12/kinetics/beers-law.html'],
        ['/rate-laws/',                       '/ap-chemistry-12/kinetics/rate-laws/'],
        ['/equilibrium_simulations.html',     '/ap-chemistry-12/equilibrium/le-chatelier.html'],
        ['/equilibrium-intro/',               '/ap-chemistry-12/equilibrium/'],
        ['/solubility/',                      '/ap-chemistry-12/solubility/'],
        ['/Titration Simulator (1).html',     '/ap-chemistry-12/acids-bases/titration.html'],
        ['/Unit 1b/08-electron-spin.html',    '/chemistry-11h/atomic-structure/08-electron-diagrams-spin.html'],
        ['/chemistry-11h/atomic-structure/08-electron-spin.html', '/chemistry-11h/atomic-structure/08-electron-diagrams-spin.html'],
        ['/Unit 1b/',                         '/chemistry-11h/atomic-structure/'],
        ['/chemical-bonding/',                '/chemistry-11h/bonding/'],
        ['/intermolecular-forces/',           '/chemistry-11h/imf/'],
        ['/bc-tides.html',                    '/other/bc-tides.html']
      ];
      var path;
      try { path = decodeURIComponent(location.pathname); } catch (e) { path = location.pathname; }
      for (var i = 0; i < MOVES.length; i++) {
        var from = MOVES[i][0], to = MOVES[i][1];
        var folder = from.charAt(from.length - 1) === '/';
        var hit = path === from || (folder && (path === from.slice(0, -1) || path.indexOf(from) === 0));
        if (hit) {
          var rest = folder ? path.slice(Math.min(path.length, from.length)) : '';
          location.replace(to + rest + location.search + location.hash);
          return;
        }
      }
    })();
  </script>
