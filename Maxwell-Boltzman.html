<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maxwell-Boltzmann distribution</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f0f1a;
        color: #c8cad8;
        font-family: system-ui, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      #root {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        min-height: 100%;
      }
      #canvas-wrap {
        flex: 1;
        min-height: 0;
        position: relative;
      }
      #sim {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: crosshair;
      }
      #sim.grabbing-curve {
        cursor: ew-resize;
      }
      #sim.dragging-threshold {
        cursor: col-resize;
      }
      #controls {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        padding: 0.85rem 1rem 1.25rem;
        font-size: 0.8rem;
        letter-spacing: 0.02em;
        color: #8b8fa3;
      }
      #controls label {
        white-space: nowrap;
      }
      #kt-slider {
        width: min(420px, 55vw);
        height: 6px;
        accent-color: #6b9cff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="canvas-wrap">
        <canvas
          id="sim"
          aria-label="Maxwell-Boltzmann kinetic energy distribution simulation"
        ></canvas>
      </div>
      <div id="controls">
        <label for="kt-slider">Lower Temp</label>
        <input id="kt-slider" type="range" min="0" max="1000" value="500" />
        <label for="kt-slider">Higher Temp</label>
      </div>
    </div>
    <script>
      (function () {
        "use strict";

        var PARTICLE_COUNT = 300;
        var PARTICLE_R = 5;
        var kT_MIN = 0.5;
        var kT_MAX = 3.0;
        var E_MAX = 24;
        var kT_REF = (kT_MIN + kT_MAX) / 2;
        /** Larger margins = smaller plot area on canvas */
        var MARGIN_L = 96;
        var MARGIN_R = 56;
        var MARGIN_T = 52;
        var MARGIN_B = 76;
        /** Vertical scale vs Y_REF (peak clamps at full plot height when > 1) */
        var CURVE_Y_SCALE = 1.86;
        var TRANSITION_MS = 280;
        var CURVE_HIT_PX = 18;
        var CURVE_HIT_TAIL_PX = 34;
        var THRESH_HIT_PX = 10;
        var DRIFT_MAX = 0.3;
        var X_DRIFT_PX = 5;
        var CURVE_DRAG_SENS = 0.004;

        var COL_BLUE = "#4A90D9";
        var COL_RED = "#E84040";
        var BG = "#0f0f1a";
        var FILL_CURVE = "rgba(80, 140, 255, 0.12)";
        var STROKE_CURVE = "#a8c8ff";
        var THRESH_DASH = "#e8eaf4";

        var canvas = document.getElementById("sim");
        var ctx = canvas.getContext("2d");
        var slider = document.getElementById("kt-slider");

        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var W = 0;
        var H = 0;
        var plot = { l: 0, r: 0, t: 0, b: 0, w: 0, h: 0 };

        function sliderToKT(v) {
          var t = Number(v) / 1000;
          return kT_MIN + t * (kT_MAX - kT_MIN);
        }

        function kTToSlider(kt) {
          var t = (kt - kT_MIN) / (kT_MAX - kT_MIN);
          return Math.round(Math.max(0, Math.min(1000, t * 1000)));
        }

        var kT = sliderToKT(slider.value);
        var kTEpsilon = 1e-6;
        /** Max normalized PDF height over (E, kT) range — vertical axis is fixed. */
        var Y_REF = 1;
        var zIntegralCacheKT = NaN;
        var zIntegralCacheVal = 1;

        /** ∫ f(E) dE from 0 to E_MAX (trapezoid); cached per kT. */
        function zIntegral(kt) {
          if (Math.abs(kt - zIntegralCacheKT) < 1e-10) {
            return zIntegralCacheVal;
          }
          var n = 500;
          var sum = 0;
          var i;
          var E0;
          var E1;
          var f0;
          var f1;
          var dE;
          for (i = 0; i < n; i++) {
            E0 = (i / n) * E_MAX;
            E1 = ((i + 1) / n) * E_MAX;
            f0 = gaussDensity(E0, kt);
            f1 = gaussDensity(E1, kt);
            dE = E1 - E0;
            sum += 0.5 * (f0 + f1) * dE;
          }
          zIntegralCacheKT = kt;
          zIntegralCacheVal = Math.max(sum, 1e-15);
          return zIntegralCacheVal;
        }

        /** Normalized density so ∫ pdf dE ≈ 1 — area under plotted curve stays constant. */
        function pdfAt(E, kt) {
          return gaussDensity(E, kt) / zIntegral(kt);
        }

        function refreshYRef() {
          var maxVal = 0;
          var tk;
          var cs;
          for (tk = kT_MIN; tk <= kT_MAX + 1e-6; tk += 0.055) {
            cs = curveSamples(tk, 220);
            if (cs.ymax > maxVal) maxVal = cs.ymax;
          }
          Y_REF = Math.max(maxVal, 1e-15);
        }

        function particlesTransitioning() {
          var i;
          for (i = 0; i < particles.length; i++) {
            if (particles[i].transitioning) return true;
          }
          return false;
        }

        /** Peak position: centered at default kT, shifts right when hot / left when cold. */
        function peakMu(kt) {
          return (
            E_MAX * 0.5 +
            ((kt - kT_REF) / (kT_MAX - kT_MIN)) * E_MAX * 0.36
          );
        }

        /** Width: narrow when cold, wide when hot. */
        function sigmaKT(kt) {
          return (
            0.75 + ((kt - kT_MIN) / (kT_MAX - kT_MIN)) * 4.35
          );
        }

        function gaussDensity(E, kt) {
          var mu = peakMu(kt);
          var s = sigmaKT(kt);
          if (s <= 1e-9) return 0;
          var z = (E - mu) / s;
          return Math.exp(-0.5 * z * z);
        }

        function curveSamples(kt, n) {
          var pts = [];
          var ymax = 0;
          var i;
          var E;
          var y;
          var z = zIntegral(kt);
          for (i = 0; i <= n; i++) {
            E = (i / n) * E_MAX;
            y = gaussDensity(E, kt) / z;
            pts.push({ E: E, f: y });
            if (y > ymax) ymax = y;
          }
          return { pts: pts, ymax: ymax };
        }

        function EToX(E) {
          return plot.l + (E / E_MAX) * plot.w;
        }

        function XToE(xp) {
          return Math.max(
            0,
            Math.min(E_MAX, ((xp - plot.l) / plot.w) * E_MAX)
          );
        }

        function fToY(f) {
          if (Y_REF <= 0) return plot.b;
          var frac = (f / Y_REF) * CURVE_Y_SCALE;
          if (frac > 1) frac = 1;
          var y = plot.b - frac * plot.h;
          return y < plot.t ? plot.t : y;
        }

        function sampleEnergy(kt) {
          var cs = curveSamples(kt, 200);
          var ymax = cs.ymax;
          var fTop = ymax * 1.02;
          var k;
          var E;
          var u;
          for (k = 0; k < 120; k++) {
            E = Math.random() * E_MAX;
            u = Math.random() * fTop;
            if (u < pdfAt(E, kt)) return E;
          }
          return Math.min(E_MAX, Math.max(0, peakMu(kt) + (Math.random() + Math.random() - 1) * 3 * sigmaKT(kt)));
        }

        var particles = [];

        function makeParticle(assignedE) {
          return {
            assignedE: assignedE,
            x: EToX(assignedE),
            y: 0,
            xStart: 0,
            xEnd: 0,
            yStart: 0,
            yEnd: 0,
            t0: 0,
            transitioning: false,
            vy: (Math.random() - 0.5) * DRIFT_MAX * 2,
          };
        }

        function randomYUnderCurve(xp) {
          var E = XToE(xp);
          var f = pdfAt(E, kT);
          var yCurve = fToY(f);
          var pad = PARTICLE_R + 1;
          var bottom = plot.b - pad;
          var top = yCurve + pad;
          if (top >= bottom) return (plot.b + yCurve) / 2;
          return top + Math.random() * (bottom - top);
        }

        function initParticles() {
          refreshYRef();
          particles.length = 0;
          var i;
          var E;
          var p;
          for (i = 0; i < PARTICLE_COUNT; i++) {
            E = sampleEnergy(kT);
            p = makeParticle(E);
            p.y = randomYUnderCurve(p.x);
            particles.push(p);
          }
        }

        var thresholdE = 0.6 * E_MAX;

        function resize() {
          var wrap = canvas.parentElement;
          var rect = wrap.getBoundingClientRect();
          W = Math.floor(rect.width);
          H = Math.floor(rect.height);
          dpr = Math.min(window.devicePixelRatio || 1, 2);
          canvas.width = Math.floor(W * dpr);
          canvas.height = Math.floor(H * dpr);
          canvas.style.width = W + "px";
          canvas.style.height = H + "px";
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          plot.l = MARGIN_L;
          plot.r = W - MARGIN_R;
          plot.t = MARGIN_T;
          plot.b = H - MARGIN_B;
          plot.w = Math.max(40, plot.r - plot.l);
          plot.h = Math.max(40, plot.b - plot.t);
          refreshYRef();
        }

        var curveScreenPts = [];
        var lastFillPoly = [];

        function pointInPolygon(x, y, poly) {
          if (!poly || poly.length < 3) return false;
          var inside = false;
          var i;
          var j;
          var xi;
          var yi;
          var xj;
          var yj;
          var intersect;
          for (i = 0, j = poly.length - 1; i < poly.length; j = i++) {
            xi = poly[i].x;
            yi = poly[i].y;
            xj = poly[j].x;
            yj = poly[j].y;
            intersect =
              (yi > y) !== (yj > y) &&
              x < ((xj - xi) * (y - yi)) / (yj - yi + 1e-12) + xi;
            if (intersect) inside = !inside;
          }
          return inside;
        }

        function hitTestCurveArea(x, y) {
          if (y < plot.t || y > plot.b || x < plot.l || x > plot.r) return false;
          if (pointInPolygon(x, y, lastFillPoly)) return true;
          var tail = x > plot.l + plot.w * 0.42;
          var lim = tail ? CURVE_HIT_TAIL_PX : CURVE_HIT_PX;
          return distToPolyline(x, y, curveScreenPts) <= lim;
        }

        function distToPolyline(px, py, poly) {
          var best = Infinity;
          var i;
          var d;
          for (i = 0; i < poly.length - 1; i++) {
            d = distToSegment(
              px,
              py,
              poly[i].x,
              poly[i].y,
              poly[i + 1].x,
              poly[i + 1].y
            );
            if (d < best) best = d;
          }
          return best;
        }

        function distToSegment(px, py, x1, y1, x2, y2) {
          var dx = x2 - x1;
          var dy = y2 - y1;
          var len2 = dx * dx + dy * dy;
          var t;
          var qx;
          var qy;
          var ex;
          var ey;
          if (len2 < 1e-12) {
            ex = px - x1;
            ey = py - y1;
            return Math.sqrt(ex * ex + ey * ey);
          }
          t = ((px - x1) * dx + (py - y1) * dy) / len2;
          t = Math.max(0, Math.min(1, t));
          qx = x1 + t * dx;
          qy = y1 + t * dy;
          ex = px - qx;
          ey = py - qy;
          return Math.sqrt(ex * ex + ey * ey);
        }

        var dragCurve = false;
        var dragThresh = false;
        var dragCurveAnchorX = 0;
        var dragCurveAnchorKT = 0;
        var lastPointerX = 0;

        function updateTransitionTargets() {
          var i;
          var p;
          var newE;
          for (i = 0; i < particles.length; i++) {
            p = particles[i];
            newE = sampleEnergy(kT);
            p.assignedE = newE;
            p.xEnd = EToX(newE);
            p.yEnd = randomYUnderCurve(p.xEnd);
          }
        }

        function applyTemperature(nextKT, syncSlider) {
          var clamped = Math.max(kT_MIN, Math.min(kT_MAX, nextKT));
          if (Math.abs(clamped - kT) < kTEpsilon) {
            if (syncSlider) slider.value = String(kTToSlider(kT));
            return;
          }
          kT = clamped;
          if (syncSlider) slider.value = String(kTToSlider(kT));
          if (particlesTransitioning()) {
            updateTransitionTargets();
            return;
          }
          startParticleTransition();
        }

        function startParticleTransition() {
          var now = performance.now();
          var i;
          var p;
          var newE;
          for (i = 0; i < particles.length; i++) {
            p = particles[i];
            newE = sampleEnergy(kT);
            p.xStart = p.x;
            p.assignedE = newE;
            p.xEnd = EToX(newE);
            p.yStart = p.y;
            p.yEnd = randomYUnderCurve(p.xEnd);
            p.t0 = now;
            p.transitioning = true;
          }
        }

        function easeOutCubic(t) {
          return 1 - Math.pow(1 - t, 3);
        }

        function stepParticles(now) {
          var i;
          var p;
          var u;
          var e;
          var anchor;
          var E;
          var f;
          var yTop;
          var yBot;
          for (i = 0; i < particles.length; i++) {
            p = particles[i];
            if (p.transitioning) {
              u = Math.min(1, (now - p.t0) / TRANSITION_MS);
              e = easeOutCubic(u);
              p.x = p.xStart + (p.xEnd - p.xStart) * e;
              p.y = p.yStart + (p.yEnd - p.yStart) * e;
              /* Keep under the *current* curve while kT changes during drag */
              E = XToE(p.x);
              f = pdfAt(E, kT);
              yTop = fToY(f) + PARTICLE_R + 1;
              yBot = plot.b - PARTICLE_R - 1;
              if (yTop >= yBot - 1) {
                p.y = (yTop + yBot) / 2;
              } else {
                p.y = Math.max(yTop, Math.min(yBot, p.y));
              }
              if (u >= 1) {
                p.transitioning = false;
                p.x = p.xEnd;
                E = XToE(p.x);
                f = pdfAt(E, kT);
                yTop = fToY(f) + PARTICLE_R + 1;
                yBot = plot.b - PARTICLE_R - 1;
                if (yTop >= yBot - 1) {
                  p.y = (yTop + yBot) / 2;
                } else {
                  p.y = Math.max(yTop, Math.min(yBot, p.y));
                }
              }
            } else {
              p.x += (Math.random() - 0.5) * DRIFT_MAX * 2;
              anchor = EToX(p.assignedE);
              p.x = Math.max(
                anchor - X_DRIFT_PX,
                Math.min(anchor + X_DRIFT_PX, p.x)
              );
              p.vy += (Math.random() - 0.5) * 0.06;
              p.vy = Math.max(-DRIFT_MAX, Math.min(DRIFT_MAX, p.vy));
              p.y += p.vy;
              E = XToE(p.x);
              f = pdfAt(E, kT);
              yTop = fToY(f) + PARTICLE_R + 1;
              yBot = plot.b - PARTICLE_R - 1;
              if (p.y < yTop) {
                p.y = yTop;
                p.vy *= -0.45;
              }
              if (p.y > yBot) {
                p.y = yBot;
                p.vy *= -0.45;
              }
            }
          }
        }

        function drawAxes() {
          ctx.save();
          ctx.strokeStyle = "#5a5e72";
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(plot.l, plot.t);
          ctx.lineTo(plot.l, plot.b);
          ctx.lineTo(plot.r, plot.b);
          ctx.stroke();
          ctx.fillStyle = "#8b8fa3";
          ctx.font = "12px system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "top";
          ctx.fillText("Kinetic Energy", plot.l + plot.w / 2, plot.b + 8);
          ctx.textBaseline = "alphabetic";
          ctx.save();
          ctx.translate(MARGIN_L * 0.35, plot.t + plot.h / 2);
          ctx.rotate(-Math.PI / 2);
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("Number of Particles", 0, 0);
          ctx.restore();
          ctx.restore();
        }

        function drawCurveAndFill(pts) {
          if (Y_REF <= 0) return;
          var i;
          ctx.beginPath();
          ctx.moveTo(EToX(0), plot.b);
          for (i = 0; i < pts.length; i++) {
            ctx.lineTo(EToX(pts[i].E), fToY(pts[i].f));
          }
          ctx.lineTo(EToX(E_MAX), plot.b);
          ctx.closePath();
          ctx.fillStyle = FILL_CURVE;
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(EToX(pts[0].E), fToY(pts[0].f));
          for (i = 1; i < pts.length; i++) {
            ctx.lineTo(EToX(pts[i].E), fToY(pts[i].f));
          }
          ctx.strokeStyle = STROKE_CURVE;
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        function drawThreshold() {
          var x = EToX(thresholdE);
          ctx.save();
          ctx.setLineDash([6, 6]);
          ctx.strokeStyle = THRESH_DASH;
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.moveTo(x, plot.t);
          ctx.lineTo(x, plot.b);
          ctx.stroke();
          ctx.restore();
        }

        function drawParticles() {
          var i;
          var p;
          var E;
          for (i = 0; i < particles.length; i++) {
            p = particles[i];
            E = XToE(p.x);
            ctx.fillStyle = E >= thresholdE ? COL_RED : COL_BLUE;
            ctx.beginPath();
            ctx.arc(p.x, p.y, PARTICLE_R, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        function renderFrame(now) {
          var cd = curveSamples(kT, 280);
          var i;
          curveScreenPts.length = 0;
          for (i = 0; i < cd.pts.length; i++) {
            curveScreenPts.push({
              x: EToX(cd.pts[i].E),
              y: fToY(cd.pts[i].f),
            });
          }
          lastFillPoly.length = 0;
          for (i = 0; i < cd.pts.length; i++) {
            lastFillPoly.push({
              x: EToX(cd.pts[i].E),
              y: fToY(cd.pts[i].f),
            });
          }
          lastFillPoly.push({ x: EToX(E_MAX), y: plot.b });
          stepParticles(now);
          ctx.fillStyle = BG;
          ctx.fillRect(0, 0, W, H);
          drawAxes();
          drawCurveAndFill(cd.pts);
          drawParticles();
          drawThreshold();
        }

        var raf = 0;

        function loop(now) {
          renderFrame(now || performance.now());
          raf = requestAnimationFrame(loop);
        }

        function scheduleResize() {
          resize();
          initParticles();
        }

        window.addEventListener("resize", scheduleResize);

        slider.addEventListener("input", function () {
          applyTemperature(sliderToKT(slider.value), false);
        });

        function pointerPos(ev) {
          var rect = canvas.getBoundingClientRect();
          var x = (ev.clientX - rect.left) * (W / rect.width);
          var y = (ev.clientY - rect.top) * (H / rect.height);
          return { x: x, y: y };
        }

        canvas.addEventListener("mousedown", function (ev) {
          var o = pointerPos(ev);
          var x = o.x;
          var y = o.y;
          lastPointerX = x;
          var tx = EToX(thresholdE);
          if (Math.abs(x - tx) <= THRESH_HIT_PX && y >= plot.t && y <= plot.b) {
            dragThresh = true;
            canvas.classList.add("dragging-threshold");
            ev.preventDefault();
            return;
          }
          if (hitTestCurveArea(x, y)) {
            dragCurve = true;
            dragCurveAnchorX = x;
            dragCurveAnchorKT = kT;
            canvas.classList.add("grabbing-curve");
            ev.preventDefault();
          }
        });

        window.addEventListener("mousemove", function (ev) {
          if (!dragCurve && !dragThresh) return;
          var o = pointerPos(ev);
          var x = o.x;
          var nk;
          if (dragCurve) {
            nk =
              dragCurveAnchorKT + (x - dragCurveAnchorX) * CURVE_DRAG_SENS;
            applyTemperature(nk, true);
          } else if (dragThresh) {
            thresholdE = XToE(x);
            thresholdE = Math.max(0, Math.min(E_MAX, thresholdE));
          }
          lastPointerX = x;
        });

        function endDrag() {
          dragCurve = false;
          dragThresh = false;
          canvas.classList.remove("grabbing-curve", "dragging-threshold");
        }

        window.addEventListener("mouseup", endDrag);
        window.addEventListener("blur", endDrag);

        canvas.addEventListener(
          "touchstart",
          function (ev) {
            if (ev.touches.length !== 1) return;
            var t = ev.touches[0];
            var o = pointerPos(t);
            var x = o.x;
            var y = o.y;
            lastPointerX = x;
            var tx = EToX(thresholdE);
            if (Math.abs(x - tx) <= THRESH_HIT_PX && y >= plot.t && y <= plot.b) {
              dragThresh = true;
              canvas.classList.add("dragging-threshold");
              ev.preventDefault();
              return;
            }
            if (hitTestCurveArea(x, y)) {
              dragCurve = true;
              dragCurveAnchorX = x;
              dragCurveAnchorKT = kT;
              canvas.classList.add("grabbing-curve");
              ev.preventDefault();
            }
          },
          { passive: false }
        );

        canvas.addEventListener(
          "touchmove",
          function (ev) {
            if (!dragCurve && !dragThresh) return;
            if (ev.touches.length !== 1) return;
            ev.preventDefault();
            var t = ev.touches[0];
            var o = pointerPos(t);
            var x = o.x;
            var nk;
            if (dragCurve) {
              nk =
                dragCurveAnchorKT + (x - dragCurveAnchorX) * CURVE_DRAG_SENS;
              applyTemperature(nk, true);
            } else if (dragThresh) {
              thresholdE = XToE(x);
              thresholdE = Math.max(0, Math.min(E_MAX, thresholdE));
            }
            lastPointerX = x;
          },
          { passive: false }
        );

        canvas.addEventListener("touchend", endDrag);
        canvas.addEventListener("touchcancel", endDrag);

        resize();
        initParticles();
        cancelAnimationFrame(raf);
        raf = requestAnimationFrame(loop);
      })();
    </script>
  </body>
</html>
